name: Linux release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without a leading v
        required: true
        default: 1.2.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then value="${GITHUB_REF_NAME#v}"; else value="${{ inputs.version }}"; fi
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Publish self-contained Linux executable
        run: dotnet publish TOST.Linux/TOST.Linux.csproj -c Release -r linux-x64 --self-contained true -p:Version=${{ steps.version.outputs.value }} -o artifacts/linux-publish
      - name: Download checksum-verified appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset_json="$(gh api repos/AppImage/appimagetool/releases/tags/continuous --jq '.assets[] | select(.name == "appimagetool-x86_64.AppImage")')"
          url="$(jq -r .browser_download_url <<<"$asset_json")"
          digest="$(jq -r .digest <<<"$asset_json")"
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          curl --fail --location --proto '=https' --tlsv1.2 "$url" -o artifacts/appimagetool
          echo "${digest#sha256:}  artifacts/appimagetool" | sha256sum --check --strict
          chmod +x artifacts/appimagetool
      - name: Build portable, AppImage, and Arch packages
        env:
          APPIMAGETOOL: ${{ github.workspace }}/artifacts/appimagetool
        run: bash packaging/linux/build-packages.sh "${{ steps.version.outputs.value }}" artifacts/linux-publish artifacts/linux-release
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: TOST-${{ steps.version.outputs.value }}-linux
          path: artifacts/linux-release/*
          if-no-files-found: error
